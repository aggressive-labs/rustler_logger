name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Format, lint & test
    runs-on: [self-hosted, build00]
    defaults:
      run:
        working-directory: rustler_logger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: rustler_logger

      # Cargo.toml declares rustler_logger_macro as a path dependency, so the
      # sibling repo has to be checked out next to this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: aggressive-labs/rustler_logger_macro
          path: rustler_logger_macro

      # Toolchain versions come from mise.toml. Rust is installed through rustup.
      - name: Install toolchain with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: rustler_logger
          install_args: rust
          cache: false

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -F testing -- -D warnings

      - name: Run tests
        run: cargo test -F testing
